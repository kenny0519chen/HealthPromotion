const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString('zh-TW');const money=n=>'NT$'+fmt(n);const rate=(a,b)=>b?100*a/b:null;const pct=n=>n===null?'無適用項目':n.toFixed(1)+'%';const point=n=>(n>=0?'+':'')+n.toFixed(1)+' 個百分點';const teamBy=id=>TEAMS.find(t=>t.id===id);const valid=(r,date)=>r.eligible&&r.completed&&r.completed>=RULES.from&&r.completed<=date&&r.completed<=RULES.end;const status=(r,date)=>!r.eligible?'na':valid(r,date)?'done':'pending';const statusLabel={na:'不符合資格',done:'已完成',pending:'尚未完成'};
function aggregate(people,date=state.asOf,task='all'){let eligible=0,done=0,before=0,added=0,value=0;const detail=TASKS.map(()=>({eligible:0,done:0,before:0,added:0,value:0}));for(const p of people)p.records.forEach((r,k)=>{if(task!=='all'&&Number(task)!==k||!r.eligible)return;eligible++;detail[k].eligible++;if(valid(r,date)){done++;detail[k].done++;value+=pay[k];detail[k].value+=pay[k];if(r.completed<RULES.start){before++;detail[k].before++}else{added++;detail[k].added++}}});return{eligible,done,before,added,left:eligible-done,value,rate:rate(done,eligible),detail,people:people.length}}
function ranks(date){let rows=TEAMS.map(t=>({...t,...aggregate(PEOPLE.filter(p=>p.team===t.id),date)}));for(const g of ['A','B','C']){const list=rows.filter(t=>t.group===g&&t.eligible>0).sort((a,b)=>b.done*a.eligible-a.done*b.eligible||a.id.localeCompare(b.id));for(let i=0;i<list.length;i++){const r=list[i],prev=list[i-1],next=list[i+1];r.rank=prev&&prev.done*r.eligible===r.done*prev.eligible?prev.rank:i+1;r.tied=Boolean(prev&&prev.done*r.eligible===r.done*prev.eligible||next&&next.done*r.eligible===r.done*next.eligible)}}return rows.sort((a,b)=>a.group.localeCompare(b.group)||(a.rank??999)-(b.rank??999))}
function rankPrizes(rows){const prizes=new Map();for(const g of ['A','B','C']){const eligible=rows.filter(r=>r.group===g&&r.rank>0);for(const rank of new Set(eligible.map(r=>r.rank))){const tied=eligible.filter(r=>r.rank===rank),pool=RULES.prizes[g].slice(rank-1,rank-1+tied.length).reduce((a,b)=>a+b,0),amount=Math.floor(pool/tied.length);for(const r of tied)prizes.set(r.id,amount)}}return prizes}
function rewards(date){const rows=ranks(date),prizes=rankPrizes(rows),total=rows.reduce((s,r)=>s+r.value,0),raw=total*RULES.rate,over=raw>RULES.unitBudget;return {raw,over,total,rows:rows.map(r=>{const unit=Math.floor(over&&total?RULES.unitBudget*r.value/total:r.value*RULES.rate);const prize=!['A','B','C'].includes(r.group)?null:prizes.get(r.id)??0;return{...r,raw:r.value*RULES.rate,unit,prize,totalReward:prize===null?null:unit+prize}})}}
const metric=(label,value,note='',accent=false)=>`<div class="metric ${accent?'accent':''}"><span>${label}</span><strong>${value}</strong>${note?`<small>${note}</small>`:''}</div>`;const panel=(title,content)=>`<section class="panel section"><h2>${title}</h2>${content}</section>`;const bar=(v)=>`<div class="bar"><i style="width:${v??0}%"></i></div>`;const pill=s=>`<span class="pill ${s}">${statusLabel[s]}</span>`;const options=(arr,val)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('');const select=(id,label,arr,val)=>`<label>${label}<select id="${id}">${options(arr,val)}</select></label>`;const table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="empty">沒有符合條件的資料</td></tr>`}</tbody></table></div>`;
function hero(title,desc){return `<div class="hero"><div class="eyebrow">HEALTH UP！｜健康不等待，行動就現在</div><h1>${title}</h1><p>${desc}</p><div class="meta"><span>成果認列 2026/01/01 – 2027/01/31</span><span>模擬資料截至 ${state.asOf}</span></div></div>`}
function statGrid(s){return `<div class="grid">${metric('參賽人數',fmt(s.people),'員工人數')}${metric('符合資格',fmt(s.eligible),'項次')}${metric('累計完成',fmt(s.done),'項次',true)}${metric('尚未完成',fmt(s.left),'項次')}${metric('整體完成率',pct(s.rate),'依總項次計算',true)}</div>`}
function stack(s){return s.eligible?`<div class="stack"><i style="width:${s.before/s.eligible*100}%;background:#1c3447"></i><i style="width:${s.added/s.eligible*100}%;background:#529bb9"></i><i style="width:${s.left/s.eligible*100}%;background:#dce7ee"></i></div><div class="legend"><span><i class="dot" style="background:#1c3447"></i>活動前 ${fmt(s.before)}</span><span><i class="dot" style="background:#529bb9"></i>活動期間 ${fmt(s.added)}</span><span><i class="dot" style="background:#dce7ee"></i>尚未完成 ${fmt(s.left)}</span></div>`:'<p class="muted">無適用項目</p>'}

function home(){return hero('光田健康挑戰賽','每天守護他人的健康，也別忘了守護自己。')+`<div class="grid">${metric('健康挑戰','6 大','依個人適用資格參與')}${metric('競賽分組','3 組','A、B、C組')}${metric('團體獎勵上限','35萬元','單位獎勵＋名次獎金',true)}</div>`+panel('活動期程',`<div class="grid">${metric('競賽期間','11/30 – 01/31','2026 → 2027')}${metric('成果認列起日','2026/01/01','今年已完成也計入')}${metric('成果公告','2027/02','正式核定後發放')}</div><button data-page="${state.role==='employee'?'personal':state.role==='manager'?'manager':'dashboard'}">查看健康挑戰進度</button> <button class="secondary" data-page="rank">查看排行榜</button>`)+panel('六大健康挑戰任務',`<div class="grid tasks">${TASKS.map(t=>`<div class="panel task"><span class="symbol">${t[2]}</span><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join('')}</div><p>只需完成自己符合資格的項目；每人同一項目只計一次。問卷及 InBody 併入成人健檢，不另計。</p>`)+panel('競賽分組與受檢方式',`<div class="grid">${metric('A組','46人以上')}${metric('B組','19～45人')}${metric('C組','10～18人')}</div><p>依115/11/24分組名冊，共58個參賽單位、2,123人（含護理類23隊）。另列7人單位暫不納入競賽統計。</p><p>常態健康檢查服務照常辦理，不必等待活動場次或平台啟用。員工健康日相關資訊另行公告。</p><p class="notice">${esc(state.announcement||'目前尚無員工健康日公告（模擬）。')}</p>`)+panel('活動洽詢','<p>平台網址、健檢服務窗口及主辦單位分機待院方提供；本頁為測試版本。</p>')}

function leaderboard(){const date=state.rankDate,rows=ranks(date).filter(r=>state.group==='all'||r.group===state.group),baseline=new Map(ranks('2026-11-29').map(r=>[r.id,r]));const earlier=[ '2026-11-29',...RULES.stages].filter(d=>d<date).at(-1)||'2026-11-29';const prev=new Map(ranks(earlier).map(r=>[r.id,r.rank]));return hero('團隊競賽排行榜','各組依累計完成率排名，僅呈現團隊成績。')+panel('階段成績',`<div class="timeline">${RULES.stages.map((d,i)=>`<button data-rankdate="${d}" class="${date===d?'selected':''}"><small>第${i+1}階段</small>${d.replaceAll('-','/')}</button>`).join('')}</div><div class="toolbar" style="margin-top:12px">${select('group','組別',[['all','全部組別'],['A','A組'],['B','B組'],['C','C組']],state.group)}${select('rankDate','查詢日期',[...new Set([state.asOf,...RULES.stages,RULES.end])].map(d=>[d,d===state.asOf?'目前模擬進度 '+d:d]),date)}<button class="secondary" id="exportRank">匯出排行榜 CSV</button></div><p class="muted">模擬歷次快照：${date}。進步幅度相較 2026/11/29；名次變動相較前一階段。</p><p class="warn">依實際完成率排名，同分並列、所占前三名獎金合併均分；無適用項次不排名。測試版調整隊伍對應後，歷史模擬統計也會重算，正式公告快照須由院內系統保存。</p>`+['A','B','C'].filter(g=>state.group==='all'||g===state.group).map(g=>`<h3 style="margin-top:16px">${g}組</h3>${table(['名次','隊伍','符合資格','完成','未完成','完成率','進步幅度','名次變動'],rows.filter(r=>r.group===g).map(r=>{const b=baseline.get(r.id),v=prev.get(r.id);return [r.rank?`<span class="${r.rank<=3?'ranktop':''}">${r.rank}${r.tied?'（同分）':''}</span>`:'—',r.name,r.eligible,r.done,r.left,pct(r.rate),r.rate===null||b.rate===null?'—':point(r.rate-b.rate),r.rank&&v?(v-r.rank>0?'↑ '+(v-r.rank):v-r.rank<0?'↓ '+(r.rank-v):'—'):'—']}))}`).join(''))}

function csv(name,heads,rows){const cell=x=>'"'+String(x??'').replace(/<[^>]*>/g,'').replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';const b=new Blob(['\ufeff'+[heads,...rows].map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;resetFilters();render();window.scrollTo(0,0)});document.querySelectorAll('[data-rankdate]').forEach(b=>b.onclick=()=>{state.rankDate=b.dataset.rankdate;render()});for(const id of ['person','managerUnit','group','team','task','asOf','status','rankDate']){if($(id))$(id).onchange=e=>{if(id==='asOf'&&(!e.target.value||e.target.value<RULES.from||e.target.value>RULES.end)){e.target.value=state.asOf;return}state[id]=e.target.value;if(id==='rankDate')state.asOf=state.rankDate;if(id==='group')state.team='all';if(id==='asOf')state.rankDate=state.asOf;render()}}if($('query'))$('query').oninput=e=>{state.query=e.target.value;const pos=e.target.selectionStart;render();$('query').focus();$('query').setSelectionRange(pos,pos)};document.querySelectorAll('[data-pay]').forEach(e=>e.onchange=()=>{const n=Number(e.value);if(e.value!==''&&Number.isInteger(n)&&n>=0&&n<=100000)pay[+e.dataset.pay]=n;render()});if($('resetPay'))$('resetPay').onclick=()=>{pay=[...DEFAULT_PAY];render()};document.querySelectorAll('[data-unit]').forEach(e=>e.onchange=()=>{const old=TEAMS.find(t=>t.units.some(u=>u.id===e.dataset.unit)),target=teamBy(e.value);if(old===target)return;const u=old.units.find(u=>u.id===e.dataset.unit);old.units=old.units.filter(x=>x.id!==u.id);target.units.push(u);for(const t of [old,target]){t.count=t.units.reduce((s,u)=>s+u.count,0);t.group=group(t.count)}PEOPLE.filter(p=>p.unit===u.id).forEach(p=>p.team=target.id);render()});if($('saveAnnouncement'))$('saveAnnouncement').onclick=()=>{state.announcement=$('announcement').value;render()};if($('exportMembers'))$('exportMembers').onclick=()=>csv('HEALTH_UP_模擬員工紀錄',['員工編號','姓名','行政單位','健康任務','狀態','完成日期'],memberRows(state.role==='manager'?PEOPLE.filter(p=>p.unit===state.managerUnit):adminPeople()));if($('exportSummary'))$('exportSummary').onclick=()=>{const p=adminPeople();csv('HEALTH_UP_模擬統計',['隊伍','組別','參賽人數','資格','完成','未完成','完成率','活動前','活動期間','產值'],TEAMS.filter(t=>p.some(x=>x.team===t.id)).map(t=>{const s=aggregate(p.filter(x=>x.team===t.id),state.asOf,state.task);return[t.name,t.group,s.people,s.eligible,s.done,s.left,pct(s.rate),s.before,s.added,s.value]}))};if($('exportRank'))$('exportRank').onclick=()=>csv('HEALTH_UP_模擬排行榜',['日期','組別','隊伍','名次','同分','資格','完成','完成率'],ranks(state.rankDate).filter(r=>state.group==='all'||r.group===state.group).map(r=>[state.rankDate,r.group,r.name,r.rank??'',r.tied?'是':'否',r.eligible,r.done,pct(r.rate)]));if($('exportRewards'))$('exportRewards').onclick=()=>csv('HEALTH_UP_模擬獎勵',['組別','隊伍','名次','產值','原試算','單位獎勵','名次獎金','總額'],rewards(state.asOf).rows.map(r=>[r.group,r.name,r.rank??'',r.value,r.raw,r.unit,r.prize??'待確認',r.totalReward??'待確認']))}

function render2(){if(!NAV[state.role].some(x=>x[0]===state.page))state.page=navNew[state.role][1];$('crumb').textContent=labels[state.page];$('mobileTitle').textContent=labels[state.page];$('nav').innerHTML=navNew[state.role].map(id=>`<button data-page="${id}" class="${state.page===id?'active':''}">${ico(pageIcons[id])}${labels[id]}</button>`).join('');$('main').innerHTML=headerPage()+({home:home2,personal:personal2,manager:manager2,dashboard:dashboard2,rank:leaderboard2,rewards:reward2,setup:setup2}[state.page])()+`<footer>HEALTH UP！光田健康挑戰資訊平台 ・ 隊伍名稱及人數依分組名冊；個人紀錄及支付金額為模擬值。正式上線前須完成院內帳號、資料及伺服器端權限驗證。</footer>`;oldBind();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;resetFilters();$('sidebar').classList.remove('open');payOpen=false;render();window.scrollTo(0,0)});document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{state.group=b.dataset.group;render()});document.querySelectorAll('[data-trend]').forEach(b=>b.onclick=()=>{trendMode=b.dataset.trend;render()});if($('trendStart'))$('trendStart').onchange=e=>{trendStart=e.target.value||RULES.from;render()};if($('resetView'))$('resetView').onclick=()=>{resetFilters();trendStart=RULES.from;render()};$('refreshPage').onclick=()=>render();if($('exportPage'))$('exportPage').onclick=()=>exportCurrent();if($('adjustPay'))$('adjustPay').onclick=()=>{payOpen=true;$('payDialog').classList.add('open')};if($('closePay'))$('closePay').onclick=()=>{payOpen=false;$('payDialog').classList.remove('open')};if(payOpen&&$('payDialog'))$('payDialog').classList.add('open');if($('saveSnapshot'))$('saveSnapshot').onclick=()=>{snapshots[state.rankDate]={rows:JSON.parse(JSON.stringify(ranks(state.rankDate)))};render()};if($('rulesOpen'))$('rulesOpen').onclick=()=>{const d=document.createElement('div');d.className='dialogshade open';d.innerHTML=`<div class="dialog"><div class="actions"><button class="secondary" id="closeRules">關閉</button></div><h2>活動規則</h2><p>競賽期間：2026/11/30～2027/01/31；成果認列：2026/01/01～2027/01/31。符合資格者均納入分母，認列期間完成者納入分子，活動前已完成亦計入產值與10%獎勵。同一員工同一項目僅認列一次。</p><p>A組46人以上、B組19～45人、C組10～18人；依115/11/24分組名冊共58隊、2,123人；另列7人單位暫不列計。各組取前三名，名次獎金共104,000元；單位獎勵額度246,000元，超額時按全院完成產值比例分配。總額上限35萬元。</p><p>同仁自主受檢，個人資訊限授權範圍使用；排行榜僅公布團體成績。</p></div>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>d.remove()}}
function exportCurrent(){if(state.page==='rank'){csv('HEALTH_UP_模擬排行榜',['日期','組別','隊伍','名次','符合資格','完成','完成率'],rankData().filter(r=>state.group==='all'||r.group===state.group).map(r=>[state.rankDate,r.group,r.name,r.rank??'',r.eligible,r.done,pct2(r.rate)]));return}if(state.page==='rewards'){csv('HEALTH_UP_模擬獎勵',['組別','隊伍','名次','產值','單位獎勵','名次獎金','總額'],rewards(state.asOf).rows.filter(r=>state.group==='all'||r.group===state.group).map(r=>[r.group,r.name,r.rank??'',r.value,r.unit,r.prize??'待確認',r.totalReward??'待確認']));return}if(state.page==='personal'){const p=PEOPLE.find(p=>p.id===state.person);csv('HEALTH_UP_模擬個人紀錄',['員工編號','任務','狀態','完成日期'],p.records.map((r,i)=>[p.id,TASKS[i][0],statusLabel[status(r,state.asOf)],valid(r,state.asOf)?r.completed:'']));return}const pp=state.page==='manager'?PEOPLE.filter(p=>p.unit===state.managerUnit):adminPeople();const ss=aggregate(pp,state.asOf,state.task);csv('HEALTH_UP_模擬統計',['任務','符合資格','已完成','未完成','完成率','活動前','活動期間','產值'],ss.detail.map((d,i)=>[TASKS[i][0],d.eligible,d.done,d.eligible-d.done,pct2(rate(d.done,d.eligible)),d.before,d.added,d.value]));}
